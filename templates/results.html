{% extends "base.html" %}
{% block title %}SlugRecover — Results{% endblock %}

{% block content %}
<div class="card compact">
    <div class="results-bar">
        <span class="card-label">📁 <span id="results-count">0</span> files found</span>
        <div class="btn-row" style="margin:0;">
            <button class="btn btn-xs" onclick="selectAll()">Select All</button>
            <button class="btn btn-xs" onclick="selectNone()">None</button>
            <button class="btn btn-xs btn-primary" id="btn-recover-selected" onclick="recoverSelected()" disabled>💾 Recover (0)</button>
            <button class="btn btn-xs btn-success" onclick="recoverAll()">✅ Recover All</button>
        </div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Save To</label>
        <input type="text" id="output-dir" value="{{ settings.output_dir }}">
    </div>

    <div class="results-grid" id="results-grid">
        <div class="empty-state">
            <div class="icon">🔍</div>
            <p>No results yet. Run a scan from the Dashboard.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadResults();
});
</script>
{% endblock %}
