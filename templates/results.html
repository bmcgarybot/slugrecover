{% extends "base.html" %}
{% block title %}SlugRecover — Results{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <span class="icon">📁</span>
        <h2>Recovery Results</h2>
    </div>

    <div class="results-header">
        <span id="results-count">Loading...</span>
        <div class="btn-group">
            <button class="btn btn-sm btn-secondary" onclick="selectAll()">Select All</button>
            <button class="btn btn-sm btn-secondary" onclick="selectNone()">Select None</button>
            <button class="btn btn-sm btn-primary" id="btn-recover-selected" onclick="recoverSelected()" disabled>Recover Selected (0)</button>
            <button class="btn btn-sm btn-success" onclick="recoverAll()">Recover All</button>
        </div>
    </div>

    <div class="form-group">
        <label>Output Directory</label>
        <input type="text" id="output-dir" value="{{ settings.output_dir }}">
    </div>

    <div class="results-grid" id="results-grid">
        <p class="text-center" style="color:var(--text-muted);grid-column:1/-1;">
            No scan results yet. Run a scan from the Dashboard first.
        </p>
    </div>
</div>

<!-- Stats card -->
<div class="card" id="stats-card" style="display:none;">
    <div class="card-header">
        <span class="icon">📊</span>
        <h2>Recovery Statistics</h2>
    </div>
    <div class="progress-stats" id="recovery-stats"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadResults();

    // Load recovery stats
    fetch('/api/stats')
        .then(r => r.json())
        .then(data => {
            if (data.total_files > 0) {
                const statsCard = document.getElementById('stats-card');
                const statsGrid = document.getElementById('recovery-stats');
                if (statsCard) statsCard.style.display = 'block';
                if (statsGrid) {
                    statsGrid.innerHTML = `
                        <div class="stat-box">
                            <div class="stat-value">${data.total_files}</div>
                            <div class="stat-label">Files Recovered</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${formatBytes(data.total_size)}</div>
                            <div class="stat-label">Total Size</div>
                        </div>
                    `;
                    for (const [type, info] of Object.entries(data.by_type)) {
                        statsGrid.innerHTML += `
                            <div class="stat-box">
                                <div class="stat-value">${info.count}</div>
                                <div class="stat-label">${type}</div>
                            </div>
                        `;
                    }
                }
            }
        });
});
</script>
{% endblock %}
